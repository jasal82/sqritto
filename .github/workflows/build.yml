name: Test, build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Typst ist eine große Abhängigkeit; so bleibt das Kompilieren im Speicher der Runner.
  CARGO_BUILD_JOBS: 2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Rust stable
        run: rustup update stable --no-self-update
      - name: Select Rust stable
        run: rustup default stable
      - name: Cache Rust dependencies and compiled artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-release
      - name: Validate version and release tag
        run: node scripts/version.mjs
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --version=6.7.3 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check site and web interface
        run: npm run typecheck
      - name: Check interface translations
        run: npm run i18n
      - name: Build engine, site and web interface for embedding
        run: npm run build
      - name: Test Markdoc engine
        run: npm test
      - name: Test Rust program
        # Gleiches Profil wie der Paket-Build, damit die Abhängigkeiten (vor allem Typst)
        # nur einmal kompiliert werden.
        run: cargo test --locked --release --all-targets
      - name: Build Windows program and installer
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SQRITTO_FRONTEND_READY: '1'
        run: build.cmd
      - name: Test Windows installer and installed program
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Package Windows portable program
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = node scripts/version.mjs
          Compress-Archive -Path dist/Sqritto.exe, dist/LICENSE.txt, dist/LICENSE-MIT-0.txt, dist/THIRD-PARTY-LICENSES.txt -DestinationPath "dist/packages/Sqritto-$version-windows-x64-portable.zip"
      - name: Build and package Unix program
        if: runner.os != 'Windows'
        env:
          SQRITTO_FRONTEND_READY: '1'
        run: sh build.sh
      - name: Smoke-test packaged program
        if: runner.os != 'Windows'
        run: node scripts/smoke-test.mjs dist/sqritto
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: packages
      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          sha256sum -- * > SHA256SUMS.txt
          # Ein fehlgeschlagener Upload hinterlässt einen Entwurf; veröffentlicht wird erst,
          # wenn alle Dateien hochgeladen sind.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Sqritto $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber -- *
          gh release edit "$RELEASE_TAG" --draft=false
