[package]
name = "sqritto"
version = "0.9.0"
edition = "2024"
rust-version = "1.92"
description = "Docs-as-Code Dokumentenwerkstatt: Markdoc und Typst zu PDF und HTML5"
license = "Apache-2.0 AND MIT-0"
default-run = "sqritto"

[[bin]]
name = "sqritto"
path = "src/main.rs"

[features]
default = []

[dependencies]
# Typst als eingebettete Bibliothek
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-render = "0.15.1"
tiny-skia = "0.12"
typst-ide = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = [
    "embedded-fonts",
    "scan-fonts",
    "system-packages",
    "system-downloader",
] }

# Web-Server
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "trace", "set-header"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
futures-util = "0.3"

# JavaScript-Engine für Markdoc
rquickjs = { version = "0.14", features = ["loader"] }

# Git
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# Diverses
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
toml_edit = "0.23"
tokio-stream = { version = "0.1", features = ["sync"] }
urlencoding = "2"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
open = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "html", "regex-fancy"] }
two-face = { version = "0.4.3", default-features = false, features = ["syntect-fancy"] }
blake3 = "1"
rand = "0.9"
walkdir = "2"
notify = "8"
trash = "5"
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }
regex = "1"
once_cell = "1"
sys-locale = "0.3"
base64 = "0.22"
ecow = "0.2.6"
comemo = "0.5.1"

# Natives App-Fenster (WebView2 unter Windows, WKWebView unter macOS)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }

# Linux: Dateidialoge über das XDG Desktop Portal (zenity als Rückfall) und
# OpenSSL für Typst-Paket-Downloads statisch eingebunden, damit das Programm
# nicht von der OpenSSL-Version der Distribution abhängt.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
typst-kit = { version = "0.15.1", features = ["vendor-openssl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
