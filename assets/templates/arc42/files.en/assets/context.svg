    <text x="600" y="186" font-weight="600">Telematics</text>
    <text x="600" y="203" font-size="11" fill="#64748b">External provider</text>

    <rect x="585" y="258" width="148" height="60" rx="8" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 3"/>
    <text x="600" y="284" font-weight="600">Workshop portal</text>
    <text x="600" y="301" font-size="11" fill="#64748b">Partner workshops</text>
