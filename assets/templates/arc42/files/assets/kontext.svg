<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="759" height="379" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <path d="M190 92 L300 160"/>
    <path d="M190 288 L300 220"/>
    <path d="M460 160 L585 92"/>
    <path d="M460 190 L585 190"/>
    <path d="M460 220 L585 288"/>
  </g>
  <g font-size="10.5" fill="#64748b">
    <text x="206" y="112">Touren planen</text>
    <text x="206" y="272">Aufträge, Status</text>
    <text x="470" y="108">Kosten, Stammdaten</text>
    <text x="472" y="182">GPS, Fahrzeugdaten</text>
    <text x="478" y="276">Wartungstermine</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <!-- Personen -->
    <rect x="30" y="60" width="160" height="64" rx="32" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="62" cy="86" r="7" fill="#4f46e5"/>
    <path d="M50 108a12 10 0 0 1 24 0" fill="#4f46e5"/>
    <text x="84" y="88" font-weight="600">Disposition</text>
    <text x="84" y="105" font-size="11" fill="#64748b">Webanwendung</text>

    <rect x="30" y="256" width="160" height="64" rx="32" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="62" cy="282" r="7" fill="#4f46e5"/>
    <path d="M50 304a12 10 0 0 1 24 0" fill="#4f46e5"/>
    <text x="84" y="284" font-weight="600">Fahrpersonal</text>
    <text x="84" y="301" font-size="11" fill="#64748b">Mobile App</text>

    <!-- System -->
    <rect x="300" y="135" width="160" height="110" rx="14" fill="#4f46e5"/>
    <text x="380" y="182" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">FlottenPilot</text>
    <text x="380" y="204" text-anchor="middle" font-size="11" fill="#e0e7ff">Flottenmanagement</text>

    <!-- Nachbarsysteme -->
    <rect x="585" y="62" width="148" height="60" rx="8" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 3"/>
    <text x="600" y="88" font-weight="600">ERP-System</text>
    <text x="600" y="105" font-size="11" fill="#64748b">SAP S/4HANA</text>

    <rect x="585" y="160" width="148" height="60" rx="8" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 3"/>
    <text x="600" y="186" font-weight="600">Telematik</text>
    <text x="600" y="203" font-size="11" fill="#64748b">externer Anbieter</text>

    <rect x="585" y="258" width="148" height="60" rx="8" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 3"/>
    <text x="600" y="284" font-weight="600">Werkstattportal</text>
    <text x="600" y="301" font-size="11" fill="#64748b">Vertragswerkstätten</text>
  </g>
  <g font-size="10.5" fill="#64748b">
    <rect x="30" y="345" width="12" height="12" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="48" y="355">Benutzergruppe</text>
    <rect x="160" y="345" width="12" height="12" rx="2" fill="#fff" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="178" y="355">Nachbarsystem</text>
    <rect x="290" y="345" width="12" height="12" rx="2" fill="#4f46e5"/>
    <text x="308" y="355">betrachtetes System</text>
