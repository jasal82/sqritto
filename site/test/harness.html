<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Vorschau-Testumgebung</title>
<style>
  body { margin: 0; display: grid; grid-template-columns: 1fr 260px; height: 100vh; font: 13px system-ui; }
  iframe { width: 100%; height: 100%; border: 0; border-right: 1px solid #ccc; }
  aside { padding: 8px; overflow: auto; }
  pre { white-space: pre-wrap; font-size: 11px; }
</style>
</head>
<body>
<iframe id="f" src="preview/installation.html"></iframe>
<aside>
  <button id="reload">ts:reload</button>
  <button id="hard">reload hard</button>
  <input id="line" type="number" value="40" style="width:60px"><button id="go">scrollToLine</button>
  <pre id="log"></pre>
</aside>
<script>
  const f = document.getElementById('f');
  const log = (m) => (document.getElementById('log').textContent = JSON.stringify(m) + '\n' + document.getElementById('log').textContent);
  window.received = [];
  window.addEventListener('message', (e) => { window.received.push(e.data); log(e.data); });
  document.getElementById('reload').onclick = () => f.contentWindow.postMessage({ type: 'ts:reload' }, '*');
  document.getElementById('hard').onclick = () => f.contentWindow.postMessage({ type: 'ts:reload', hard: true }, '*');
  document.getElementById('go').onclick = () => f.contentWindow.postMessage({ type: 'ts:scrollToLine', line: Number(document.getElementById('line').value) }, '*');
</script>
</body>
</html>
